name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Verify Python build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sprint 2 Estalv-IA prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m py_compile app.py estalvia_core.py tests/test_core.py

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: Sprint 2 Estalv-IA prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests
